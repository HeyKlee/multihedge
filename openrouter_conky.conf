--[[
Conky config for OpenRouter dashboard (Linux).
Refresh script must output: /tmp/openrouter_widget.json
Run: python3 /path/to/openrouter_widget.py  (or call via cron every 5 min)
Then: conky -c ~/.conky/openrouter_conky.conf
]]
conky.config = {
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 40,
    minimum_width = 350,
    maximum_width = 350,
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager',
    background = false,
    cpu_avg_samples = 2,
    double_buffer = true,
    default_color = '#e0e0e0',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    stippled_borders = 0,
    update_interval = 300,
    uppercase = false,
    use_spacer = 'none',
    override_utf8_locale = true,
    font = 'DejaVu Sans:size=10',
    lua_load = '~/.conky/conky_func.lua',
};

conky.text = [[
${color #00c8ff}${font DejaVu Sans:size=14:weight=bold}OpenRouter Dashboard${font}${color}
${color #a0a0a0}Updated: ${exec date '+%Y-%m-%d %H:%M:%S'} UTC${color}

${color #ff6464}${font DejaVu Sans:size=11:weight=bold}TOP 3 <= $0.10${font}${color}
${execpi 300 python3 -c "import json; d=json.load(open('/tmp/openrouter_widget.json')); [print(f'  {i+1}. {m[\"name\"]}  ${m[\"avg_price\"]}') for i,m in enumerate(d.get('top_models',[])[:3])]"}

${color #00ff96}${font DejaVu Sans:size=11:weight=bold}TOP 3 FREE${font}${color}
${execpi 300 python3 -c "import json; d=json.load(open('/tmp/openrouter_widget.json')); [print(f'  {i+1}. {m[\"name\"]}') for i,m in enumerate(d.get('free_models',[])[:3])]"}

${color #00c8ff}${font DejaVu Sans:size=11:weight=bold}PERSONAL USAGE (24h)${font}${color}
${color #ff6464}Spend: $ ${execpi 300 python3 -c "import json; print(json.load(open('/tmp/openrouter_widget.json')).get('personal_spend_last_24h',0))"}
${color #a0a0a0}${execpi 60 python3 -c "
import json
d=json.load(open('/tmp/openrouter_widget.json'))
u=d.get('personal_usage_per_model',{})
if not u:
    print('No usage data (run openrouter_widget.py with OPENROUTER_API_KEY)')
else:
    for m,v in sorted(u.items(), key=lambda x:-x[1].get('total_usage',0))[:5]:
        print(f'  {m}: {v.get(\"tokens_total\",0)} tokens  ${v.get(\"total_usage\",0):.4f}')
"}
]];