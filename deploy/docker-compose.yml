services:
  multihedge:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    container_name: multihedge
    restart: unless-stopped
    # FINDING 008 (2026-09-28 torn write): the DB used to be bind-mounted as a SINGLE
    # FILE, so SQLite placed the container's -wal/-shm in the container's writable layer
    # while host tools created their own beside the host file: two independent
    # write-ahead logs over one database. That is what tore 9 pages and destroyed 20 rows.
    #
    # Mounting the DIRECTORY makes the sidecars shared, so there is exactly one WAL.
    #
    # It is deliberately NOT ./data/, because deploy/data/ also holds signer.env,
    # agent.env, .env (mode 0600) and signer_state/live_queue (mode 0700). Mounting that
    # directory would put the Solana signer key inside the trading container and break the
    # key-isolation invariant. The database therefore gets its own mount at deploy/db/,
    # and runtime_paths is the single resolver for its location.
    volumes:
      - ./db:/app/db
      - ./data/agent.env:/app/.env:ro
      - ./data/agent_logs:/data/agent_logs:ro
      - ../multihedge.db:/data/legacy_multihedge.db:ro
      - /home/kelly/.hermes/cron/output/7d265dcb701f:/data/council_reports:ro
      - ./price_history:/app/price_history
    environment:
      - TZ=Pacific/Auckland
      - PYTHONUNBUFFERED=1
      # Single source of truth for where the ledger lives (ATLAS Rule A). The host and the
      # container now name the SAME file, and /app/db is a shared directory, so both share
      # one -wal/-shm pair.
      - MULTIHEDGE_DB=/app/db/multihedge.db
      - MULTIHEDGE_CYCLES_LOG=/data/agent_logs/cycles.jsonl
      - MULTIHEDGE_LEGACY_DB=/data/legacy_multihedge.db
    ports:
      # Dashboard UI. Host-reachable on 0.0.0.0 so XORA's Tailscale interface
      # (100.64.0.1:9052) can forward to it. Tailnet ACLs handle access control.
      # Do NOT add public exposure (kittxora.duckdns.org) without HeyKlee's OK.
      - "0.0.0.0:9052:9052"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"