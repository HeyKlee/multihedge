# ATLAS Rule C (FINDING 004): exit thresholds are NOT declared here.
#
# This block used to declare POSITION_FRACTION/TAKE_PROFIT/STOP_LOSS/MAX_HOLD_SECS/
# TRAIL_*/CONFIDENCE_MIN, and it was a rival source of truth that silently disagreed with
# the runtime. Its own comment admitted the drift: "this declared 10800 while the applied
# override was 7200". The bare mh_reasoner_params table then won outright at TAKE_PROFIT
# 0.05, a value present in no source file, which is why editing config or source changed
# nothing.
#
# Single owner: live_inventory.py declares the defaults; policy.effective_policy() resolves
# them and applies an override ONLY when it carries provenance (source, approved_by,
# approved_at). See the current values with:  python3 ops/policy_report.py
#
# To change a threshold, either edit the owner in live_inventory.py, or record an APPROVED
# row in mh_policy_overrides. Do not add numbers back here.
reasoner: {}
grid:
  enabled: true
  starting_cash_nzd: 40
