[Rainmeter]
Update=300000
DynamicWindowSize=1
AccurateText=1
SkinWidth=350
BackgroundMode=2
SolidColor=0,0,0,180

[Metadata]
Name=OpenRouter Widget
Author=HeyKlee (XORA)
Information=Shows OpenRouter top models, free models, personal usage and spend
Version=1.0
License=MIT

; --- Variables ---
[Variables]
; Path to the JSON cache file written by openrouter_widget.py
; On Windows with WSL, use a shared path like \\wsl$\Ubuntu\tmp\openrouter_widget.json
; Or run the Python script on Windows and write to C:\temp\openrouter_widget.json
JsonFile=#CURRENTPATH#openrouter_widget.json

; Colors
ColorBg=0,0,0,180
ColorText=255,255,255
ColorHeader=0,200,255
ColorFree=0,255,150
ColorPaid=255,180,0
ColorSpend=255,80,80
ColorMuted=160,160,160
FontFace=Segoe UI
FontSize=10

; --- Measures ---
[MeasureJSON]
Measure=Plugin
Plugin=WebParser
Url=file://#JsonFile#
RegExp=(?s)^(.*)$
UpdateRate=300
FinishAction=[!EnableMeasureGroup Parse][!UpdateMeasureGroup Parse][!Redraw]

[MeasureTimestamp]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="timestamp"[^}]*"([^"]*)"
Substitute="T":" ","Z":""
DynamicVariables=1

[MeasureTop1Id]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="top_models"[^}]*"id"[^}]*"([^"]*)"
DynamicVariables=1
[MeasureTop1Name]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="top_models"[^}]*"name"[^}]*"([^"]*)"
DynamicVariables=1
[MeasureTop1Price]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="top_models"[^}]*"avg_price"[^}]*([0-9.]+)
DynamicVariables=1

[MeasureTop2Id]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="top_models"[^}]*"id"[^}]*"id"[^}]*"([^"]*)"
DynamicVariables=1
[MeasureTop2Name]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="top_models"[^}]*"name"[^}]*"name"[^}]*"([^"]*)"
DynamicVariables=1
[MeasureTop2Price]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="top_models"[^}]*"avg_price"[^}]*([0-9.]+)[^}]*"avg_price"[^}]*([0-9.]+)
DynamicVariables=1

[MeasureTop3Id]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="top_models"[^}]*"id"[^}]*"id"[^}]*"id"[^}]*"([^"]*)"
DynamicVariables=1
[MeasureTop3Name]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="top_models"[^}]*"name"[^}]*"name"[^}]*"name"[^}]*"([^"]*)"
DynamicVariables=1
[MeasureTop3Price]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="top_models"[^}]*"avg_price"[^}]*([0-9.]+)[^}]*"avg_price"[^}]*"avg_price"[^}]*([0-9.]+)
DynamicVariables=1

[MeasureFree1Id]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="free_models"[^}]*"id"[^}]*"([^"]*)"
DynamicVariables=1
[MeasureFree1Name]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="free_models"[^}]*"name"[^}]*"([^"]*)"
DynamicVariables=1

[MeasureFree2Id]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="free_models"[^}]*"id"[^}]*"id"[^}]*"([^"]*)"
DynamicVariables=1
[MeasureFree2Name]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="free_models"[^}]*"name"[^}]*"name"[^}]*"([^"]*)"
DynamicVariables=1

[MeasureFree3Id]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="free_models"[^}]*"id"[^}]*"id"[^}]*"id"[^}]*"([^"]*)"
DynamicVariables=1
[MeasureFree3Name]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="free_models"[^}]*"name"[^}]*"name"[^}]*"name"[^}]*"([^"]*)"
DynamicVariables=1

; Personal usage - we'll parse the whole object and use Lua for complex parsing
[MeasureUsageRaw]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="personal_usage_per_model"[^}]*({[^}]*})"
DynamicVariables=1

[MeasureSpend]
Measure=Plugin
Plugin=WebParser
Url=[MeasureJSON]
StringIndex=1
RegExp="personal_spend_last_24h"[^:]*:([0-9.]+)
DynamicVariables=1

; --- Meters ---
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,350,[#SkinHeight#],5 | Fill Color #ColorBg# | StrokeWidth 0

[MeterTitle]
Meter=String
X=15
Y=10
FontFace=#FontFace#
FontSize=14
FontWeight=600
FontColor=#ColorHeader#
Text="OpenRouter Dashboard"
AntiAlias=1

[MeterUpdated]
Meter=String
X=15
Y=34
FontFace=#FontFace#
FontSize=8
FontColor=#ColorMuted#
Text="Updated: [MeasureTimestamp]"
AntiAlias=1

; --- Top Models Section ---
[MeterTopHeader]
Meter=String
X=15
Y=58
FontFace=#FontFace#
FontSize=11
FontWeight=600
FontColor=#ColorPaid#
Text="TOP 3 <= $0.10"
AntiAlias=1

[MeterTop1]
Meter=String
X=15
Y=78
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text="1. [MeasureTop1Name]  $[MeasureTop1Price]"
AntiAlias=1

[MeterTop2]
Meter=String
X=15
Y=98
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text="2. [MeasureTop2Name]  $[MeasureTop2Price]"
AntiAlias=1

[MeterTop3]
Meter=String
X=15
Y=118
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text="3. [MeasureTop3Name]  $[MeasureTop3Price]"
AntiAlias=1

; --- Free Models Section ---
[MeterFreeHeader]
Meter=String
X=15
Y=148
FontFace=#FontFace#
FontSize=11
FontWeight=600
FontColor=#ColorFree#
Text="TOP 3 FREE"
AntiAlias=1

[MeterFree1]
Meter=String
X=15
Y=168
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text="1. [MeasureFree1Name]"
AntiAlias=1

[MeterFree2]
Meter=String
X=15
Y=188
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text="2. [MeasureFree2Name]"
AntiAlias=1

[MeterFree3]
Meter=String
X=15
Y=208
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text="3. [MeasureFree3Name]"
AntiAlias=1

; --- Personal Usage Section ---
[MeterUsageHeader]
Meter=String
X=15
Y=238
FontFace=#FontFace#
FontSize=11
FontWeight=600
FontColor=#ColorHeader#
Text="PERSONAL USAGE (24h)"
AntiAlias=1

[MeterSpend]
Meter=String
X=15
Y=258
FontFace=#FontFace#
FontSize=11
FontWeight=600
FontColor=#ColorSpend#
Text="Spend: $[MeasureSpend]"
AntiAlias=1

; Usage per model - placeholder (requires Lua for dynamic list)
[MeterUsagePlaceholder]
Meter=String
X=15
Y=278
FontFace=#FontFace#
FontSize=9
FontColor=#ColorMuted#
Text="Per-model breakdown: run openrouter_widget.py"
AntiAlias=1

; --- Refresh Button ---
[MeterRefresh]
Meter=String
X=270
Y=10
FontFace=#FontFace#
FontSize=9
FontColor=#ColorHeader#
Text="REFRESH"
AntiAlias=1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor 255,255,255][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor #ColorHeader#][!UpdateMeter #CURRENTSECTION#][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureJSON "Update"][!UpdateMeasureGroup Parse][!Redraw]